services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fisgarank_app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
    volumes:
      - ./data:/app/data
      - ./public/uploads:/app/public/uploads
    networks:
      - fisgarank_net

  caddy:
    image: caddy:2-alpine
    container_name: fisgarank_caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - fisgarank_net
    depends_on:
      - app

networks:
  fisgarank_net:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:

